<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigia Noturna — Fangame</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <!-- Camada DOM dos animatronics (PNG/GIF em tela cheia) -->
    <div id="enemy-layer"></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-power">🔋 <span id="hud-power-value">100%</span></div>
      <div id="hud-clock">🕐 <span id="hud-clock-value">12:00 AM</span></div>
      <div id="hud-night"><span id="hud-night-value">Noite 1</span></div>
    </div>

    <!-- Controles do escritório.
         Loop de 3 visões: 0 Centro (computador) → 1 Porta → 2 Janela → volta ao 0. -->
    <div id="office-controls" class="hidden">
      <button id="nav-left"  class="nav-btn nav-left"  data-action="turn" data-dir="-1" aria-label="Virar à esquerda">◀</button>
      <button id="nav-right" class="nav-btn nav-right" data-action="turn" data-dir="1"  aria-label="Virar à direita">▶</button>

      <!-- só aparece na visão marcada com monitorButton em VIEWS (Porta) — controlado por UI.syncControls -->
      <button id="btn-open-monitor" class="monitor-btn hidden">📺 Câmeras</button>

      <!-- cada painel só aparece na visão que controla a respectiva porta/janela.
           O texto "PORTA"/"JANELA" é desenhado no canvas. -->
      <div class="door-panel hidden" data-door="porta">
        <button data-action="toggle-light" data-door="porta">💡 Luz</button>
        <button data-action="toggle-door"  data-door="porta">🚪 Fechar</button>
      </div>
      <div class="door-panel hidden" data-door="janela">
        <button data-action="toggle-light" data-door="janela">💡 Luz</button>
        <button data-action="toggle-door"  data-door="janela">🪟 Fechar</button>
      </div>
    </div>

    <!-- Monitor de câmeras -->
    <div id="camera-monitor" class="hidden">
      <div id="camera-tabs"></div>
      <button id="btn-close-monitor">✕ Fechar Monitor</button>
    </div>

    <div id="loading-screen" class="screen"><h1>Carregando…</h1></div>

    <!-- Menu principal -->
    <div id="menu-screen" class="screen hidden">
      <h1>Vigia Noturna</h1>
      <p class="subtitle">
        Um fangame ponto-e-clique de terror noturno, com arquitetura pronta
        para você trocar todos os sprites pelas fotos da sua própria casa,
        família e pets.
      </p>
      <button id="btn-start">Começar Noite 1</button>
      <button id="btn-custom"      class="hidden">Custom Night</button>
      <button id="btn-infinite"    class="hidden">Modo Infinito</button>
      <button id="btn-leaderboard" class="hidden">🏆 Ranking</button>
    </div>

    <!-- Custom Night -->
    <div id="custom-screen" class="screen hidden">
      <h2>Custom Night</h2>
      <div id="custom-levels"></div>
      <div class="screen-buttons">
        <button id="btn-custom-start">Começar</button>
        <button data-action="back-to-menu">Voltar</button>
      </div>
    </div>

    <!-- Ranking do Modo Infinito -->
    <div id="leaderboard-screen" class="screen hidden">
      <h2>Melhores tempos — Modo Infinito</h2>
      <ol id="menu-leaderboard-list" class="leaderboard"></ol>
      <div class="screen-buttons">
        <button id="btn-clear-leaderboard">Limpar</button>
        <button data-action="back-to-menu">Voltar</button>
      </div>
    </div>

    <!-- Game over -->
    <div id="gameover-screen" class="screen hidden">
      <h1>Você foi pego.</h1>
      <div id="gameover-infinite" class="hidden">
        <p id="gameover-time"></p>
        <p id="gameover-rank"></p>
        <ol id="gameover-leaderboard" class="leaderboard"></ol>
      </div>
      <div class="screen-buttons">
        <button id="btn-retry">Tentar Novamente</button>
        <button id="btn-menu-gameover">Menu</button>
      </div>
    </div>

    <!-- Vitória -->
    <div id="victory-screen" class="screen hidden">
      <h1 id="victory-title">Noite concluída!</h1>
      <div class="screen-buttons">
        <button id="btn-next-night">Próxima Noite</button>
        <button id="btn-menu-victory">Menu</button>
      </div>
    </div>
  </div>

  <!-- Ordem importa: config primeiro, main.js e menuExtras.js por último.
       admin.js pode vir em qualquer lugar depois de config.js, pois só
       acessa window.game/window.* dentro dos handlers (tempo de execução,
       não tempo de parse). -->
  <script src="js/config.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/assetLoader.js"></script>
  <script src="js/doors.js"></script>
  <script src="js/power.js"></script>
  <script src="js/cameras.js"></script>
  <script src="js/enemyAI.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
  <script src="js/menuExtras.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
